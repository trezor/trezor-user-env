daemon=0
server=1
nolisten=1
txindex=1
disablewallet=0
blockfilterindex=1

# regtest has no fee estimates, so the funding wallet pays 1 sat/vB
fallbackfee=0.00001

zmqpubhashtx=tcp://127.0.0.1:48321
