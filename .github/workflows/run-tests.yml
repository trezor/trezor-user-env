name: "[Test] controller tests"

on: [pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Setup Nix
        uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: "Install dependencies with uv"
        run: nix-shell --run "uv sync"
      - name: "Download emulator binaries"
        run: nix-shell --run "uv run python ./src/binaries/firmware/bin/download.py all"
      - name: "Download node bridge"
        run: nix-shell --run "./src/binaries/node-bridge/download.sh"
      - name: "Patch emulator binaries"
        run: nix-shell --run "./src/binaries/firmware/bin/patch-bin.sh ./src/binaries/firmware/bin/"
      - name: Run tests
        run: nix-shell --run "uv run make test"
