name: "[Build] test trezor-user-env image"

on:
  workflow_dispatch:

jobs:
  build-tenv-test:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'trezor' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push trezor-user-env
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./docker/Dockerfile-debian
          platforms: linux/amd64,linux/arm64
          build-args: |
            EMULATOR_NIGHTLY_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/trezor-user-env:${{ github.sha }}

  # WSL rootfs of the amd64 image for Windows runners (see README)
  export-rootfs:
    runs-on: ubuntu-latest
    needs: build-tenv-test
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2
        with:
          version: 1.3.4
      - name: Export image filesystem
        shell: bash
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/trezor-user-env@${{ needs.build-tenv-test.outputs.digest }}
          docker pull --platform linux/amd64 "$IMAGE"
          CID=$(docker create --platform linux/amd64 "$IMAGE")
          docker export "$CID" | gzip -1 > tenv-rootfs.tar.gz
          docker rm "$CID"
          ls -lh tenv-rootfs.tar.gz
      - name: Push rootfs
        run: |
          oras push \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            ghcr.io/${{ github.repository_owner }}/trezor-user-env-rootfs:${{ github.sha }} \
            tenv-rootfs.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip
