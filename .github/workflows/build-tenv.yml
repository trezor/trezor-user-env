name: "[Build] trezor-user-env image"
on:
  push:
    branches:
      - master
  schedule:
    - cron: "0 1 * * *"

jobs:
  build-tenv:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'trezor' }}
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push trezor-user-env
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7
        with:
          context: .
          file: ./docker/Dockerfile-debian
          platforms: linux/amd64,linux/arm64
          build-args: |
            EMULATOR_NIGHTLY_CACHE_BUST=${{ github.run_id }}-${{ github.run_attempt }}
          push: true
          # todo: using github.sha does not take into account downloaded binaries in Dockerfile.debian => sha stays same
          tags: |
            ghcr.io/${{ github.repository_owner }}/trezor-user-env:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/trezor-user-env:latest

  # WSL rootfs of the amd64 image for Windows runners (see README)
  export-rootfs:
    runs-on: ubuntu-latest
    needs: build-tenv
    steps:
      - name: Login to GitHub Container Registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up ORAS
        uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2
        with:
          version: 1.3.4
      - name: Export image filesystem
        shell: bash
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/trezor-user-env@${{ needs.build-tenv.outputs.digest }}
          docker pull --platform linux/amd64 "$IMAGE"
          CID=$(docker create --platform linux/amd64 "$IMAGE")
          docker export "$CID" | gzip -1 > tenv-rootfs.tar.gz
          docker rm "$CID"
          ls -lh tenv-rootfs.tar.gz
      - name: Push rootfs
        run: |
          oras push \
            --annotation "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            ghcr.io/${{ github.repository_owner }}/trezor-user-env-rootfs:${{ github.sha }},latest \
            tenv-rootfs.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip

