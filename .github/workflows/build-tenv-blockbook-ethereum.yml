name: "[Build] trezor-user-env-blockbook-ethereum image"

on:
  push:
    branches:
      - master
    paths:
      - "docker/blockbook-ethereum/**"
      - ".github/workflows/build-tenv-blockbook-ethereum.yml"
  pull_request:
    paths:
      - "docker/blockbook-ethereum/**"
      - ".github/workflows/build-tenv-blockbook-ethereum.yml"
  workflow_dispatch:

jobs:
  build-tenv-blockbook-ethereum:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'trezor' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Read image tag
        id: image-tag
        run: |
          version=$(sed -n 's/^ARG BLOCKBOOK_VERSION=//p' docker/blockbook-ethereum/Dockerfile)
          echo "tag=${version}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Login to GitHub Container Registry
        if: ${{ github.ref == 'refs/heads/master' }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push blockbook-ethereum
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: docker/blockbook-ethereum
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/trezor-user-env-blockbook-ethereum:${{ steps.image-tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/trezor-user-env-blockbook-ethereum:latest
